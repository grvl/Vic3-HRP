<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victoria 3 — Ideology Affinity Groups</title>
<meta name="description" content="Browse bonds and rivalries between Victoria 3 character ideologies, read live from a Google Sheet.">
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="Show ideology list" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="brand">
    <span class="brand-mark">V3</span>
    <span class="brand-text">
      <strong>Ideology Affinity Groups</strong>
      <small id="statusLine">Loading…</small>
    </span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" title="Re-read the sheet" aria-label="Reload data from the sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <button role="tab" class="tab is-active" data-view="ideology">Ideologies</button>
  <button role="tab" class="tab" data-view="groups">Groups</button>
  <button role="tab" class="tab" data-view="rivalries">Rivalry lines</button>
  <button role="tab" class="tab" data-view="matrix">Matrix</button>
  <button role="tab" class="tab" data-view="notes">Notes</button>
</nav>

<div class="shell">

  <aside class="sidebar" id="sidebar" aria-label="Ideology list">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="search" placeholder="Search ideologies…" autocomplete="off" spellcheck="false" aria-label="Search ideologies">
    </div>
    <div class="ideology-list" id="ideologyList"></div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="content" id="content">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Reading the sheet…</p>
    </div>
  </main>

</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
